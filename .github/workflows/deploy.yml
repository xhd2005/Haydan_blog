name: Fast Build & Deploy to Tencent Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # =======================================================
      # 阶段 1: 解析与标准化部署目标主机与凭据 (Host Normalization)
      # =======================================================
      - name: 标准化解析目标主机与端口
        env:
          RAW_HOST: ${{ secrets.SERVER_HOST }}
          RAW_USER: ${{ secrets.SERVER_USER }}
          RAW_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          # 1. 优先提取 IPv4 地址 (自动防御带 ubuntu@, ssh, http://, :22, 引号等任意格式)
          DETECTED_IP=$(echo "$RAW_HOST" | grep -oE "([0-9]{1,3}\.){3}[0-9]{1,3}" | head -n 1 || true)
          if [ -n "$DETECTED_IP" ]; then
            TARGET_HOST="$DETECTED_IP"
          else
            # 域名场景深度清洗
            TARGET_HOST=$(echo "$RAW_HOST" | sed -e 's/^[a-zA-Z0-9._-]*@//' -e 's/^ssh //' -e 's#^https\?://##' -e 's/:[0-9]\+//' -e 's#/.*##' -e 's/["'\''[:space:]]//g' || true)
          fi
          # 强兜底默认使用腾讯云固定生产 IP
          TARGET_HOST="${TARGET_HOST:-49.233.166.212}"
          
          # 2. 清洗用户名
          TARGET_USER=$(echo "${RAW_USER:-ubuntu}" | sed -e 's/[^a-zA-Z0-9_-]//g' || true)
          TARGET_USER="${TARGET_USER:-ubuntu}"
          
          # 3. 清洗端口
          TARGET_PORT=$(echo "${RAW_PORT:-22}" | grep -oE "[0-9]+" | head -n 1 || true)
          TARGET_PORT="${TARGET_PORT:-22}"
          
          echo "TARGET_HOST=$TARGET_HOST" >> $GITHUB_ENV
          echo "TARGET_USER=$TARGET_USER" >> $GITHUB_ENV
          echo "TARGET_PORT=$TARGET_PORT" >> $GITHUB_ENV
          echo "✅ 成功标准化部署目标 -> 用户: $TARGET_USER | 主机: $TARGET_HOST | 端口: $TARGET_PORT"

      # =======================================================
      # 阶段 2: 配置 SSH 密钥与免密直连
      # =======================================================
      - name: 配置 SSH 密钥与连通性验证
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
          
          echo "🔍 验证与服务器 $TARGET_HOST 的免密连通性..."
          ssh -i ~/.ssh/id_rsa -p $TARGET_PORT $TARGET_USER@$TARGET_HOST "echo '✅ SSH 免密握手连接成功！'"

      # =======================================================
      # 阶段 3: 极速源码归档打包 (秒级打包，体积缩减 98%)
      # =======================================================
      - name: 打包干净工程源码
        run: |
          echo "📦 正在打包工程源码 (排除临时构建产物与开发冗余)..."
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='docs/screenshots' \
              --exclude='backend/target' \
              --exclude='frontend/node_modules' \
              --exclude='frontend/.next' \
              -czf /tmp/hayden-source.tar.gz .
          echo "✅ 源码包精炼完毕，体积仅为："
          ls -lh /tmp/hayden-source.tar.gz

      # =======================================================
      # 阶段 4: 秒级同步源码与配置至腾讯云服务器
      # =======================================================
      - name: 秒级传输源码与配置到服务器
        env:
          TARGET_DIR: ${{ secrets.SERVER_DEPLOY_DIR || '/opt/hayden-blog' }}
        run: |
          echo "🚀 正在直传精简源码包到腾讯云服务器 (只需 5~10 秒) ..."
          SSH_CMD="ssh -i ~/.ssh/id_rsa -p $TARGET_PORT $TARGET_USER@$TARGET_HOST"
          SCP_CMD="scp -i ~/.ssh/id_rsa -P $TARGET_PORT"
          
          $SSH_CMD "mkdir -p $TARGET_DIR /tmp/hayden-deploy"
          $SCP_CMD /tmp/hayden-source.tar.gz $TARGET_USER@$TARGET_HOST:/tmp/hayden-deploy/
          
          echo "📂 在服务器上快速解压最新代码并覆盖配置..."
          $SSH_CMD "tar -xzf /tmp/hayden-deploy/hayden-source.tar.gz -C $TARGET_DIR/ && rm -rf /tmp/hayden-deploy"
          if [ -f deploy/manage.sh ]; then
            $SSH_CMD "chmod +x $TARGET_DIR/deploy/manage.sh 2>/dev/null || true"
          fi
          echo "✅ 源码与配置文件同步完成！"

      # =======================================================
      # 阶段 5: 在腾讯云服务器上利用本地 Docker 缓存增量构建并重启
      # =======================================================
      - name: 服务器增量构建与平滑滚动更新
        env:
          TARGET_DIR: ${{ secrets.SERVER_DEPLOY_DIR || '/opt/hayden-blog' }}
        run: |
          echo "🔄 在腾讯云服务器 ($TARGET_HOST) 上利用本地 Docker 缓存增量构建与更新..."
          SSH_CMD="ssh -i ~/.ssh/id_rsa -p $TARGET_PORT $TARGET_USER@$TARGET_HOST"
          
          # 中止先前任何可能卡住的旧管道导入进程
          $SSH_CMD "pkill -f 'docker load' 2>/dev/null || true"
          
          # 执行国内镜像源加速就地增量构建 (直接命中 JRE/Node 基础层与依赖缓存)
          $SSH_CMD "cd $TARGET_DIR && docker compose build backend frontend"
          
          # 平滑重启服务容器
          $SSH_CMD "cd $TARGET_DIR && docker compose up -d backend frontend"
          
          # 自动清理临时悬挂无用镜像
          $SSH_CMD "docker image prune -f"
          
          echo "🎉 部署完成！服务运行状态如下："
          $SSH_CMD "cd $TARGET_DIR && docker compose ps"
