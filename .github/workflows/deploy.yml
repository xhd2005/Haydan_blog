name: Build & Deploy to Tencent Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx 构建器
        uses: docker/setup-buildx-action@v3

      # =======================================================
      # 阶段 1: 在 GitHub 高性能 Runner 上并行编译打包镜像
      # =======================================================
      - name: 构建后端 Docker 镜像
        run: |
          echo "📦 开始构建 Spring Boot 3.3 后端镜像..."
          docker build -t hayden-blog-backend:latest ./backend

      - name: 构建前端 Docker 镜像
        run: |
          echo "📦 开始构建 Next.js 14 前端镜像 (Standalone)..."
          docker build -t hayden-blog-frontend:latest ./frontend

      # =======================================================
      # 阶段 2: 配置 SSH 隧道
      # =======================================================
      - name: 配置 SSH 密钥与免密连接
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -p ${{ secrets.SERVER_PORT || 22 }} "$SERVER_HOST" >> ~/.ssh/known_hosts

      # =======================================================
      # 阶段 3: 同步最新配置与 SQL 脚本至腾讯云服务器
      # =======================================================
      - name: 同步部署配置到服务器
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          TARGET_DIR: ${{ secrets.SERVER_DEPLOY_DIR || '/opt/hayden-blog' }}
        run: |
          echo "🚀 正在同步配置文件到服务器 $TARGET_DIR ..."
          ssh -p $SERVER_PORT $SERVER_USER@$SERVER_HOST "mkdir -p $TARGET_DIR/deploy/nginx $TARGET_DIR/docs/sql $TARGET_DIR/data"
          scp -P $SERVER_PORT docker-compose.yml $SERVER_USER@$SERVER_HOST:$TARGET_DIR/
          scp -P $SERVER_PORT -r deploy/nginx/* $SERVER_USER@$SERVER_HOST:$TARGET_DIR/deploy/nginx/
          scp -P $SERVER_PORT -r docs/sql/* $SERVER_USER@$SERVER_HOST:$TARGET_DIR/docs/sql/
          scp -P $SERVER_PORT deploy/manage.sh $SERVER_USER@$SERVER_HOST:$TARGET_DIR/deploy/
          ssh -p $SERVER_PORT $SERVER_USER@$SERVER_HOST "chmod +x $TARGET_DIR/deploy/manage.sh"

      # =======================================================
      # 阶段 4: 管道流式传输镜像并即时导入
      # =======================================================
      - name: 压缩流式传输镜像并执行 docker load
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          echo "⚡ 正在通过 SSH 管道将镜像打包并直传至腾讯云服务器并导入..."
          docker save hayden-blog-backend:latest hayden-blog-frontend:latest | \
            gzip -1 | \
            ssh -C -p $SERVER_PORT $SERVER_USER@$SERVER_HOST "gunzip | docker load"
          echo "✅ 镜像传输并载入服务器成功！"

      # =======================================================
      # 阶段 5: 服务器执行平滑滚动更新
      # =======================================================
      - name: 重启服务容器
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          TARGET_DIR: ${{ secrets.SERVER_DEPLOY_DIR || '/opt/hayden-blog' }}
        run: |
          echo "🔄 在腾讯云服务器上滚动更新容器..."
          ssh -p $SERVER_PORT $SERVER_USER@$SERVER_HOST "cd $TARGET_DIR && docker compose up -d --remove-orphans"
          ssh -p $SERVER_PORT $SERVER_USER@$SERVER_HOST "docker image prune -f"
          echo "🎉 部署完成！服务运行状态如下："
          ssh -p $SERVER_PORT $SERVER_USER@$SERVER_HOST "cd $TARGET_DIR && docker compose ps"
