version: '3.8'

services:
  # =================================================================
  # 1. MySQL 8.0 数据库服务
  # =================================================================
  mysql:
    image: mysql:8.0.36
    container_name: hayden-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hayden_blog}
      MYSQL_USER: ${DB_USER:-hayden}
      MYSQL_PASSWORD: ${DB_PASS:-HaydenPass_2026!Sec}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-HaydenRoot_2026!Sec}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb_buffer_pool_size=256M
      - --max_connections=60
    volumes:
      - ./data/mysql:/var/lib/mysql
      # 首次启动时自动执行 DDL 与种子数据初始化
      - ./docs/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    networks:
      - hayden-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-HaydenRoot_2026!Sec}"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # =================================================================
  # 2. Redis 7 缓存服务
  # =================================================================
  redis:
    image: redis:7.2-alpine
    container_name: hayden-redis
    restart: always
    command: >
      redis-server 
      --requirepass "${REDIS_PASSWORD:-HaydenRedis_2026!Sec}"
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      - hayden-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-HaydenRedis_2026!Sec}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # =================================================================
  # 3. MinIO 对象存储服务
  # =================================================================
  minio:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: hayden-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-HaydenMinio_2026!Sec}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    networks:
      - hayden-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # =================================================================
  # 4. Spring Boot 3.3 后端 API
  # =================================================================
  backend:
    image: hayden-blog-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hayden-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hayden_blog}
      DB_USER: ${DB_USER:-hayden}
      DB_PASS: ${DB_PASS:-HaydenPass_2026!Sec}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-HaydenRedis_2026!Sec}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-hayden-blog}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-HaydenMinio_2026!Sec}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://127.0.0.1:9000}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - hayden-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # =================================================================
  # 5. Next.js 14 前端服务
  # =================================================================
  frontend:
    image: hayden-blog-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hayden-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_BASE: http://backend:8080
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
    networks:
      - hayden-net
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # =================================================================
  # 6. Nginx 动静分流与入口反代
  # =================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: hayden-nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - ./uploads:/uploads:ro
    networks:
      - hayden-net
    depends_on:
      - frontend
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  hayden-net:
    driver: bridge
